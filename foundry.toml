[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules", "mocks"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]
gas_reports = ["AetherVault", "AetherPool", "LiquidationEngine"]
remappings = ["mocks/=mocks/"]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fuzz]
runs = 1000